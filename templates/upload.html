<!DOCTYPE html>
<html>
<head>

    <title>Upload X-ray</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
            color:white;
        }

        .card{
            margin-top:80px;
            padding:40px;
            border-radius:20px;
            background:#1e293b;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="card">

        <h2 class="text-center mb-4">
            Upload Knee X-ray
        </h2>

        <form method="POST" enctype="multipart/form-data">

            <input type="file"
                   name="file"
                   class="form-control mb-4"
                   required>

            <button class="btn btn-primary w-100">
                Predict Arthritis
            </button>

        </form>

    </div>

</div>

</body>
</html>
