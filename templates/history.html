<!DOCTYPE html>
<html>
<head>

    <title>Prediction History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
            color:white;
        }

        .table-container{
            margin-top:50px;
            background:#1e293b;
            padding:30px;
            border-radius:20px;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="table-container">

        <h1 class="mb-4 text-center">
            Prediction History
        </h1>

        <table class="table table-dark table-hover">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Prediction</th>
                    <th>Confidence</th>
                    <th>Date</th>
                </tr>

            </thead>

            <tbody>

            {% for row in data %}

                <tr>

                    <td>{{ row[0] }}</td>

                    <td>{{ row[1] }}</td>

                    <td>{{ row[2] }}</td>

                    <td>{{ row[3] }}%</td>

                    <td>{{ row[4] }}</td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
