<!DOCTYPE html>
<html>
<head>

    <title>Prediction Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#111827;
            color:white;
        }

        .result-box{
            margin-top:40px;
            background:#1f2937;
            padding:30px;
            border-radius:20px;
        }

        img{
            border-radius:20px;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="result-box">

        <h1 class="text-center mb-5">
            Arthritis Detection Result
        </h1>

        <div class="row">

            <div class="col-md-6">

                <img src="{{ url_for('static', filename='uploads/' + filename) }}"
                     width="100%">

            </div>

            <div class="col-md-6">

                <h2>
                    Prediction:
                </h2>

                <h1 class="text-warning">
                    {{ prediction }}
                </h1>

                <h3 class="mt-4">
                    Confidence:
                </h3>

                <h2>
                    {{ confidence }} %
                </h2>

                <img src="{{ url_for('static', filename=graph) }}"
                     class="mt-4"
                     width="100%">

            </div>

        </div>

        <div class="text-center mt-5">

            <a href="/predict" class="btn btn-primary">
                Predict Another
            </a>

            <a href="/history" class="btn btn-success">
                View History
            </a>

        </div>

    </div>

</div>

</body>
</html>
